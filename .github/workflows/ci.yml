name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: python scripts/check_publication.py
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
          RUN_SUPABASE_INTEGRATION: '0'
      - run: python -m compileall -q streamlit_app.py local_streamlit_app.py src
