<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in with Google</title></head>
<body style="margin:0;font-family:system-ui,sans-serif">
<style>#status{margin:6px 0 0;font-size:14px;color:#4a6255}#status:empty{display:none}</style>
<div id="google-button"></div><p id="status" role="status">Loading Google sign-in…</p>
<script>
"use strict";
const parentOrigin = new URL(document.referrer || window.location.href).origin;
const send = (type, extra = {}) => window.parent.postMessage({isStreamlitMessage:true,type,...extra}, parentOrigin);
const fit = () => send('streamlit:setFrameHeight', {height: Math.max(44, Math.ceil(document.body.getBoundingClientRect().height) + 4)});
const setStatus = text => { document.getElementById('status').textContent = text; fit(); };
let args, lastNonce, loaded = false, submitted = false;
function render() {
  if (!loaded || !args || lastNonce === args.nonce) return;
  lastNonce = args.nonce;
  submitted = false;
  document.getElementById('google-button').replaceChildren();
  google.accounts.id.initialize({client_id:args.client_id, nonce:args.nonce,
    ux_mode:'popup', auto_select:false, use_fedcm_for_button:false,
    callback:({credential}) => {
      if (submitted || typeof credential !== 'string') return;
      submitted = true;
      setStatus('Verifying your sign-in…');
      send('streamlit:setComponentValue', {value:credential, dataType:'json'});
    }});
  google.accounts.id.renderButton(document.getElementById('google-button'),
    {type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'pill',width:300});
  setStatus('');
  setTimeout(fit, 400);
}
window.addEventListener('message', event => {
  if (event.source !== window.parent || event.origin !== parentOrigin || event.data.type !== 'streamlit:render') return;
  args = event.data.args;
  render();
});
const script = document.createElement('script');
script.src = 'https://accounts.google.com/gsi/client';
script.async = true;
script.onload = () => {loaded = true; render();};
script.onerror = () => {
  setStatus('Google sign-in could not load. Allow accounts.google.com and reload.');
};
document.head.appendChild(script);
send('streamlit:componentReady',{apiVersion:1});
fit();
</script></body></html>
